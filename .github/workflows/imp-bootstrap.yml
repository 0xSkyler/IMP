name: Bootstrap IMP from DOM
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.event.head_commit.message == 'Bootstrap IMP import workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import and apply only the watch-only keyword changes
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/0xSkyler/ProxyDesk.git /tmp/proxydesk-source
          rsync -a --exclude='.git' /tmp/proxydesk-source/ ./
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, transform):
              p = Path(path)
              original = p.read_text()
              changed = transform(original)
              assert changed != original, f'No change in {path}'
              p.write_text(changed)

          def browser_patch(source):
              start = source.index('                        const navigationBeforeClick = managed.mainNavigationSequence || 0;')
              end = source.index('                    }\n                    if (watcher.targetTextSeen)', start)
              replacement = """                        // IMP watch-only: move the native pointer over the verified result.
                        // Never activate its title, navigate to its website, or start Keep Alive.
                        let point = matched.clickPoint;
                        if (!point || !Number.isFinite(point.x) || !Number.isFinite(point.y)) {
                            try {
                                point = await withTimeout(
                                    wc.executeJavaScript('window.__domGoogleWatcher?.hoverPoint?.()'),
                                    500, () => null);
                            } catch { point = null; }
                        }
                        if (!point || !Number.isFinite(point.x) || !Number.isFinite(point.y)) {
                            return { browserId: id, status: 'monitoring', landedUrl: wc.getURL(),
                                monitoring: true, resultsScanned: totalScanned,
                                error: 'Target result found; waiting for a visible hover point.', ranAt };
                        }
                        if (measurementToken != null && !this.isMeasurementSessionCurrent(id, measurementToken))
                            return { browserId: id, status: 'monitoring', monitoring: true, ranAt };
                        wc.sendInputEvent({ type: 'mouseMove', x: Math.max(1, Math.round(point.x)),
                            y: Math.max(1, Math.round(point.y)) });
                        await delay(5_000);
                        if (measurementToken != null && !this.isMeasurementSessionCurrent(id, measurementToken))
                            return { browserId: id, status: 'monitoring', monitoring: true, ranAt };
                        if (!(0, seo_1.isSearchResultsUrl)(wc.getURL(), engine))
                            return { browserId: id, status: 'monitoring', landedUrl: wc.getURL(), monitoring: true, ranAt };
                        this.stopGoogleRecognition(managed, measurementToken);
                        totalScanned += pageMaxObserved;
                        return {
                            browserId: id, status: 'matched', landedUrl: wc.getURL(),
                            matchedUrl: matched.url || undefined, matchedTitle: matched.title,
                            resultsScanned: totalScanned, position: pageIndex * 10 + matched.organicIndex + 1,
                            resultPage: pageIndex + 1, monitoring: true,
                            interactionStatus: 'hovered', keepAliveStarted: false, ranAt
                        };
          """
              return source[:start] + replacement + source[end:]

          def preload_patch(source):
              old = "const watcher = { state: null, key: target + '|' + query + '|' + engine, click, stop, scan, get stopped() { return stopped; } };"
              new = "const watcher = { state: null, key: target + '|' + query + '|' + engine, click, hoverPoint, stop, scan, get stopped() { return stopped; } };"
              assert source.count(old) == 1
              source = source.replace(old, new, 1)
              needle = '    function click() {\n'
              assert source.count(needle) == 1
              hover = """    function hoverPoint() {
                  if (stopped) return null;
                  if (!matchedAnchor?.isConnected) scan(true);
                  if (!matchedAnchor?.isConnected || !watcher.state?.match) return null;
                  matchedAnchor.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'instant' });
                  const rect = matchedAnchor.getBoundingClientRect();
                  const x = Math.round(rect.left + rect.width / 2);
                  const y = Math.round(rect.top + rect.height / 2);
                  const hit = document.elementFromPoint(x, y);
                  return hit && matchedAnchor.contains(hit) ? { x, y } : null;
              }
          """
              return source.replace(needle, hover + needle, 1)

          def automation_patch(source):
              rejection = """        if (keywords.length > browserCount) {
                      throw new Error(\`Select at least \${keywords.length} browsers to run all keywords at the same time.\`);
                  }
          """
              # The initial number of browser windows no longer limits keywords.
              start = source.index('        if (keywords.length > browserCount) {')
              end = source.index('        this.stopTimerOnly();', start)
              source = source[:start] + source[end:]
              old = """        const observationIntervalMs = 30_000;
                  const interactionHost = controlledTestHost || (0, seo_1.normalizeTargetHost)(targetWebsite);"""
              new = """        const observationIntervalMs = 30_000;
                  const keywords = parseAutomationKeywords(this.state.query);
                  let keywordIndex = Math.max(0, keywords.indexOf(query));
                  let completed = 0;
                  const interactionHost = controlledTestHost || (0, seo_1.normalizeTargetHost)(targetWebsite);"""
              assert old in source
              source = source.replace(old, new, 1)
              start = source.index("            if (result.status === 'matched' &&\n                result.interactionStatus === 'opened'")
              end = source.index("            this.emit('seoResult', { cycleNumber, result });\n            if (result.status === 'paused')", start)
              replacement = """            if (result.status === 'matched' && result.interactionStatus === 'hovered') {
                          this.emit('seoResult', { cycleNumber, result: { ...result, query } });
                          completed += 1;
                          if (completed >= keywords.length) return;
                          keywordIndex = (keywordIndex + 1) % keywords.length;
                          query = keywords[keywordIndex];
                          continue;
                      }
          """
              return source[:start] + replacement + source[end:]

          edit('src/main/BrowserManager.js', browser_patch)
          edit('src/preload/google-results.js', preload_patch)
          edit('src/main/SeoAutomationManager.js', automation_patch)

          Path('tests/watch-only.test.cjs').write_text("""'use strict';
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const { loadTree, fakeElectron } = require('./helpers.cjs');
          const root = path.resolve(__dirname, '../src');

          test('a verified result receives a native mouse hover but never a click or target navigation', async () => {
              const electron = fakeElectron();
              const { BrowserManager } = loadTree(root, electron, {
                  setTimeout: (fn, _ms, ...args) => setImmediate(fn, ...args),
                  clearTimeout: () => {}
              })('main/BrowserManager.js');
              const manager = new BrowserManager(); manager.attachWindow(electron.window);
              await manager.createBrowser(1, { startPage: 'about:blank' });
              const managed = manager.get(1), wc = managed.view.webContents;
              const events = [], urls = [];
              wc.mainFrame = {};
              wc.isLoading = () => false;
              wc.loadURL = async url => {
                  wc.url = url;
                  urls.push(url);
                  setImmediate(() => {
                      const config = managed.googleConfig;
                      wc.emit('ipc-message', { senderFrame: wc.mainFrame }, 'dom:google-state', {
                          navigation: config.navigation, token: config.token, documentUrl: wc.getURL(),
                          state: { observedResults: 2, documentParsed: false,
                              match: { url: 'https://example.test/article', title: 'Research result',
                                  organicIndex: 0, clickPoint: { x: 40, y: 60 } } }
                      });
                  });
              };
              wc.sendInputEvent = event => events.push(event.type);
              try {
                  const token = manager.startMeasurementSession(1);
                  const result = await manager.broadcastSearch(1, 'keyword A', 'example.test', 5, token);
                  assert.equal(result.status, 'matched');
                  assert.equal(result.interactionStatus, 'hovered');
                  assert.deepEqual(events, ['mouseMove']);
                  assert.equal(result.keepAliveStarted, false);
                  assert.equal(urls.length, 1);
                  assert.equal(urls[0].includes('example.test/article'), false);
              } finally { await manager.destroyAll(); }
          });

          test('each browser advances to the next keyword after a hover, once per cycle', async () => {
              const { SeoAutomationManager } = loadTree(root, {})('main/SeoAutomationManager.js');
              const queries = [], events = [];
              const browser = {
                  isMeasurementSessionCurrent: () => true,
                  broadcastSearch: async (_id, query) => {
                      queries.push(query);
                      return { status: 'matched', interactionStatus: 'hovered' };
                  },
                  startControlledKeepAlive: () => { throw new Error('Keep Alive must not start'); }
              };
              const automation = new SeoAutomationManager({}, browser, async () => []);
              automation.state = { ...automation.state, running: true, cycleNumber: 1,
                  query: 'keyword A, keyword B, keyword C' };
              automation.on('seoResult', event => events.push(event.result.query));
              await automation.monitorBrowserSession(0, 1, 1, 1, 'keyword A', 'example.test', '', 5);
              assert.deepEqual(queries, ['keyword A', 'keyword B', 'keyword C']);
              assert.deepEqual(events, queries);
              automation.cycleController.abort();
          });
          """)
          PY
          node --check src/main/BrowserManager.js
          node --check src/main/SeoAutomationManager.js
          node --check src/preload/google-results.js
          npm run check
          node --test tests/watch-only.test.cjs
          rm .github/workflows/imp-bootstrap.yml
          git config user.name 'IMP Bootstrap'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import DOM and implement hover-only sequential keyword research'
          git push origin HEAD:main
