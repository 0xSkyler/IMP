name: IMP hardened failover Windows release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imp-windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imp-watch-only-windows-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate IMP application structure
        run: npm run check

      - name: Test IMP hover-only behavior and standalone identity
        run: node --test tests/imp-watch-only.test.cjs tests/imp-coexistence.test.cjs tests/imp-proxy-persistence.test.cjs tests/proxy-rotation.test.cjs tests/proxy-tiers.test.cjs tests/search-engines.test.cjs

      - name: Build Windows installer
        run: npm run package:windows

      - name: Validate production application archive
        run: node scripts/check-package.cjs release-windows/win-unpacked/resources/app.asar

      - name: Verify packaged native Electron launch
        shell: pwsh
        run: |
          @'
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const { _electron } = require('playwright-core');
          (async () => {
              const exe = path.resolve('release-windows/win-unpacked/IMP.exe');
              const application = await _electron.launch({ executablePath: exe, timeout: 20000 });
              try {
                  // IMP creates BrowserViews before React finishes loading.
                  // Playwright's firstWindow may therefore be about:blank.
                  let renderer = null;
                  for (let attempt = 0; attempt < 120; attempt++) {
                      renderer = application.windows().find(w => /src\/renderer\/index\.html/.test(w.url()));
                      if (renderer) break;
                      await new Promise(resolve => setTimeout(resolve, 250));
                  }
                  assert.ok(renderer, 'IMP renderer window never appeared: ' +
                      application.windows().map(w => w.url()).join(', '));
                  await renderer.waitForLoadState('domcontentloaded', { timeout: 20000 });
                  const identity = await application.evaluate(({ app }) => ({ name: app.getName(), userData: app.getPath('userData') }));
                  assert.equal(identity.name, 'IMP');
                  assert.equal(path.basename(identity.userData).toLowerCase(), 'imp');
                  console.log('IMP executable launched with its own userData profile:', identity.userData);
              } finally {
                  await application.close();
              }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          '@ | node

      - name: Generate Windows installer SHA256
        shell: pwsh
        run: |
          $name = 'IMP-v0.5.29-Windows-x64-Setup.exe'
          $installer = Join-Path 'release-windows' $name
          if (!(Test-Path $installer)) { throw "Missing installer: $installer" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content 'release-windows/SHA256SUMS-windows.txt' -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: IMP-v0.5.29-hardened-failover-Windows-x64
          path: |
            release-windows/IMP-v0.5.29-Windows-x64-Setup.exe
            release-windows/SHA256SUMS-windows.txt
          if-no-files-found: error

      - name: Publish release with verified Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='imp-v0.5.29-accurate-failover.5'
          cat > release-notes.md <<'NOTES'
          IMP watch-only research build based on DOM v0.5.29.

          Changes in IMP:
          - Hover over a verified matching search result for five seconds without clicking its title or opening the target website.
          - Continue through the supplied keyword list within each browser during the same cycle.
          - Do not start target-site Keep Alive after a result is observed.
          - Keep an assigned browser proxy across cycles as long as no connection, CAPTCHA or renderer error occurs.
          - If a proxy fails, replace it within the current cycle, keep every healthy browser untouched, and resume the interrupted keyword on the same browser.
          - If a verified result has no usable hover coordinates, observe it for five seconds and proceed without clicking.
          - Reuse unused candidates from the fetched proxy pool without re-downloading the provider list for every failed browser.
          - Preserve every existing browser assignment until a different proxy is secured; never blank a browser at cycle boundaries.
          - Retry unassigned browsers during the current cycle; reserve unique endpoints across concurrent failures.
          - Distinguish proxy/network errors from result-recognition errors; show a truthful waiting state if the source is exhausted.
          - Retry exhausted source refreshes with a cooldown, and reconsider old failed endpoints after 30 minutes.
          - Never reassign the currently failing endpoint to its own browser, including after blacklist expiry.
          - Deduplicate failed endpoints in the replacement request, keeping healthy and failed browser accounting consistent.

          Existing browser, proxy and other settings are retained.
          Original repository 0xSkyler/ProxyDesk is unchanged.

          Installer: IMP-v0.5.29-Windows-x64-Setup.exe. IMP has a separate Windows executable, installer identity, shortcuts and user profile.
          SHA256SUMS-windows.txt contains the installer SHA256.
          NOTES
          files=(
            release-windows/IMP-v0.5.29-Windows-x64-Setup.exe
            release-windows/SHA256SUMS-windows.txt
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "IMP v0.5.29 - Accurate Proxy Failover v5 (Standalone)" \
              --notes-file release-notes.md
          fi
