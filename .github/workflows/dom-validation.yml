name: IMP isolation and regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dom:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent IMP identity
        run: node -e "const p=require('./package.json');if(p.name!=='imp'||p.productName!=='IMP'||p.build.appId!=='com.imp.desktop'||p.build.win.executableName!=='IMP')throw Error('IMP Windows identity must not conflict with DOM')"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/imp-watch-only.test.cjs tests/imp-coexistence.test.cjs tests/proxy-rotation.test.cjs tests/proxy-tiers.test.cjs tests/search-engines.test.cjs
      - run: npm run check
